<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="디지털엑스 BTC·WLD 가격, V30과 매수·매도 시각">
  <title>디지털엑스 BTC·WLD 차트</title>
  <link rel="stylesheet" href="./digitalx-dashboard.css">
  <script type="module" src="./digitalx-dashboard.js"></script>
</head>
<body>
  <main>
    <header class="header">
      <div class="identity">
        <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div><h1>디지털엑스 BTC·WLD 차트</h1><p>가격 · V30 · 매수와 매도 타이밍</p></div>
      </div>
      <button class="refresh" id="refresh" type="button">새로고침</button>
    </header>
    <div id="status" class="status" role="status"><span class="lamp"></span><span>디지털엑스 데이터 연결 중</span></div>
    <div id="fills-status" class="source-note" role="status"></div>
    <div class="toolbar">
      <div class="picker"><span>코인</span><div class="group" id="coins" aria-label="코인 선택">
        <button type="button" data-coin="BTC" aria-pressed="true">BTC</button><button type="button" data-coin="WLD" aria-pressed="false">WLD</button>
      </div></div>
      <div class="picker"><span>가격 간격</span><div class="group" id="intervals" aria-label="가격 그래프 간격">
        <button type="button" data-interval="30" aria-pressed="true">30분</button><button type="button" data-interval="1" aria-pressed="false">1분</button>
      </div></div>
      <div class="picker"><span>조회 범위</span><div class="group" id="ranges" aria-label="조회 범위">
        <button type="button" data-hours="3" aria-pressed="false">3시간</button><button type="button" data-hours="6" aria-pressed="false">6시간</button><button type="button" data-hours="12" aria-pressed="false">12시간</button><button type="button" data-hours="24" aria-pressed="true">24시간</button>
      </div></div>
    </div>
    <section class="metrics" id="metrics" aria-label="최근 확정 1분봉 지표"></section>
    <section class="charts" aria-label="가격과 V30">
      <article class="panel">
        <div class="panel-title"><div><h2 id="price-title">디지털엑스 30분 종가</h2><p id="price-note">원화(KRW) · 한국시간</p></div>
        <div class="markers" aria-label="표시할 매매선">
          <label class="buy"><input type="checkbox" id="buy" checked><span>매수선</span></label>
          <label class="sell"><input type="checkbox" id="sell" checked><span>매도선</span></label>
          <label><input type="checkbox" id="signals" checked><span>V30 신호</span></label>
        </div></div>
        <div class="plot price-plot"><canvas id="price" role="img" aria-label="디지털엑스 원화 가격과 매수·매도 세로선"></canvas><p class="empty" id="price-empty" hidden>선택 범위에 표시할 확정 가격이 없습니다.</p></div>
        <div class="legend"><span><i></i>실제 체결</span><span><i class="dash"></i>V30 0선 신호</span><span id="live-key" hidden><i class="live"></i>진행 중 30분 구간</span></div>
      </article>
      <article class="panel">
        <div class="panel-title"><div><h2 id="indicator-title">V30 · 30분 가격 변화</h2><p id="indicator-note">확정 1분봉마다 계산</p></div>
        <div class="group" id="indicators" aria-label="지표 선택"><button type="button" data-key="v" aria-pressed="true">V30</button><button type="button" data-key="a" aria-pressed="false">A30</button><button type="button" data-key="j" aria-pressed="false">J30</button></div></div>
        <div class="plot indicator-plot"><canvas id="indicator" role="img" aria-label=" 30분 기준 지표와 매수·매도 세로선"></canvas><p class="empty" id="indicator-empty" hidden>연속된 확정 데이터가 부족합니다.</p></div>
      </article>
    </section>
    <section class="panel events"><div class="panel-title"><div><h2>매수·매도 시각</h2><p>시각을 누르면 그래프에서 찾을 수 있습니다.</p></div><span id="event-count" class="badge">0건</span></div>
      <div id="event-list" class="event-list"></div>
    </section>
    <footer><span>디지털엑스 · 한국시간(KST)</span><a href="./upbit-hourly.html">업비트 시간봉 연구</a></footer>
  </main>
</body>
</html>
