<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIGITALX VAJ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e8eef9;
font:14px system-ui,sans-serif}
main{max-width:1200px;margin:auto;padding:14px}
button{background:#202e44;color:white;border:1px solid #40516b;
padding:10px 15px;border-radius:8px;cursor:pointer;margin:3px}
button.active{background:#165a86}
.panel,.metric{background:#141e30;border:1px solid #2b3b54;
border-radius:12px;padding:12px;margin:8px 0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.value{font-size:22px;font-weight:bold;margin-top:8px}
svg{width:100%;height:190px;display:block}
small{color:#9fb0c8}
.buy{color:#ff4141}
.sell{color:#408cff}
@media(max-width:650px){
.cards{grid-template-columns:repeat(2,1fr)}
.value{font-size:18px}
svg{height:160px}
}
</style>
</head>
<body>
<main>
<h1>DIGITALX VAJ</h1>
<small>디지털엑스 1분봉 · 한국시간 KST</small>

<div>
<button data-coin="BTC" class="active">BTC</button>
<button data-coin="WLD">WLD</button>
</div>

<div>
<button data-period="60" class="active">60분 실전</button>
<button data-period="30">30분</button>
<button data-period="15">15분</button>
<button data-period="5">5분</button>
</div>

<div>
<button data-hours="1">1시간</button>
<button data-hours="6">6시간</button>
<button data-hours="12">12시간</button>
<button data-hours="24" class="active">24시간</button>
<button id="refresh">새로고침</button>
</div>

<p>
<label class="buy">
<input type="checkbox" id="buy" checked>매수선
</label>
<label class="sell">
<input type="checkbox" id="sell" checked>매도선
</label>
<label>
<input type="checkbox" id="signals" checked>이론적 신호
</label>
</p>

<div id="status" class="panel">데이터 연결 중</div>

<div class="cards" id="metrics"></div>

<div class="panel">
<b>가격 그래프 (KRW)</b>
<svg id="priceChart"></svg>
</div>
<div class="panel">
<b>V · 속도</b>
<svg id="vChart"></svg>
</div>
<div class="panel">
<b>A · 가속도</b>
<svg id="aChart"></svg>
</div>
<div class="panel">
<b>J · 가가속도</b>
<svg id="jChart"></svg>
</div>

<p class="buy">│ 빨간색 실선: 실제 매수 체결</p>
<p class="sell">│ 파란색 실선: 실제 매도 체결</p>
<p>○ 이론적 V 0선 돌파</p>
<small>
수평 점선은 0 기준선입니다.
가격 그래프의 체결 표시는 해당 분봉 종가 기준입니다.
60분 이외의 지표는 연구용입니다.
</small>
</main>

<script>
let coin="BTC",period=60,hours=24;
let rows=[],fills=[],generation=0,loadedCoin="";
const $=id=>document.getElementById(id);
const num=x=>x===undefined||x===""?NaN:Number(x);
const fmt=x=>Number.isFinite(x)?x.toFixed(8):"—";
const kst=t=>new Date(t).toLocaleString("ko-KR",{
 timeZone:"Asia/Seoul",month:"2-digit",day:"2-digit",
 hour:"2-digit",minute:"2-digit",hour12:false
});

function parse(text){
 const lines=text.trim().split(/\r?\n/);
 const header=lines.shift().split(",");
 return lines.filter(Boolean).map(line=>{
  const v=line.split(",");
  return Object.fromEntries(header.map((k,i)=>[k,v[i]]));
 });
}

async function load(){
 const selected=coin,g=++generation;
 try{
  const stamp=Date.now();
  const [a,b]=await Promise.all([
   fetch(`data/${selected}_VAJ_1m.csv?t=${stamp}`,
    {cache:"no-store"}),
   fetch(`data/${selected}_fills.csv?t=${stamp}`,
    {cache:"no-store"})
  ]);
  if(!a.ok||!b.ok)throw Error("CSV 조회 실패");
  const r=parse(await a.text()).filter(x=>
   x.source==="DIGITALX"&&Number.isFinite(num(x.timestamp))
   &&num(x.close)>0
  ).sort((a,b)=>num(a.timestamp)-num(b.timestamp));
  const f=parse(await b.text()).filter(x=>
   ["BUY","SELL"].includes(x.side)
   &&Number.isFinite(num(x.timestamp))
  );
  if(g!==generation)return;
  if(!r.length)throw Error("유효 데이터 없음");
  rows=r;fills=f;loadedCoin=selected;
  render();
 }catch(e){
  if(g===generation){
   $("status").textContent="조회 오류: "+e.message;
  }
 }
}

function chart(id,data,key,color,start,end){
 const svg=$(id);
 const w=svg.clientWidth||700,h=svg.clientHeight||190;
 svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
 const valid=r=>r.quality!=="UNKNOWN_GAP"
  &&Number.isFinite(num(r[key]))
  &&(key==="close"||
   !["REFERENCE_GAP","PREVIOUS_GAP","GAP_BLOCKED"]
    .includes(r["SIGNAL"+period]));
 const values=data.filter(valid).map(r=>num(r[key]));
 if(!values.length){
  svg.innerHTML='<text x="15" y="40" fill="#9fb0c8">유효 데이터 부족</text>';
  return;
 }
 let lo=Math.min(...values),hi=Math.max(...values);
 if(key!=="close"){lo=Math.min(lo,0);hi=Math.max(hi,0)}
 const pad=(hi-lo||Math.abs(hi)||1)*0.12;
 lo-=pad;hi+=pad;
 const L=76,R=w-14,T=12,B=h-28;
 const x=t=>L+(t-start)/(end-start||1)*(R-L);
 const y=v=>T+(hi-v)/(hi-lo)*(B-T);
 let out="";
 for(let i=0;i<4;i++){
  const v=lo+(hi-lo)*i/3,py=y(v);
  out+=`<line x1="${L}" x2="${R}" y1="${py}" y2="${py}" stroke="#2b3b54"/>`;
  out+=`<text x="${L-5}" y="${py+3}" text-anchor="end" fill="#9fb0c8" font-size="10">${key==="close"?v.toFixed(0):v.toFixed(5)}</text>`;
 }
 if(key!=="close"){
  out+=`<line x1="${L}" x2="${R}" y1="${y(0)}" y2="${y(0)}" stroke="#cbd5e1" stroke-dasharray="5 4"/>`;
 }
 let path="",prev=null;
 for(const r of data){
  const t=num(r.timestamp);
  if(!valid(r)){prev=null;continue}
  path+=(prev!==null&&t-prev===60000?" L":" M")
   +x(t)+" "+y(num(r[key]));
  prev=t;
 }
 out+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>`;

 for(const f of fills){
  const t=num(f.timestamp);
  if(t<start||t>end)continue;
  if(f.side==="BUY"&&!$("buy").checked)continue;
  if(f.side==="SELL"&&!$("sell").checked)continue;
  const c=f.side==="BUY"?"#ff4141":"#408cff";
  out+=`<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${B}" stroke="${c}" stroke-width="2.5"><title>${f.side} ${kst(t)}</title></line>`;
  const r=data.find(r=>num(r.timestamp)===Math.floor(t/60000)*60000);
  if(r&&valid(r)){
   out+=`<circle cx="${x(t)}" cy="${y(num(r[key]))}" r="4.5" fill="${c}" stroke="white" stroke-width="1.3"/>`;
  }
 }

 if($("signals").checked&&key==="V"+period){
  for(let i=1;i<data.length;i++){
   const r=data[i],p=data[i-1],s=r["SIGNAL"+period];
   if(!["BUY","SELL"].includes(s)||!valid(r)||!valid(p))continue;
   if(num(r.timestamp)-num(p.timestamp)!==60000)continue;
   const a=num(p[key]),b=num(r[key]);
   if(a===b)continue;
   const t=num(p.timestamp)+60000*(-a)/(b-a);
   if(t<start||t>end)continue;
   out+=`<circle cx="${x(t)}" cy="${y(0)}" r="5" fill="#141e30" stroke="${s==="BUY"?"#ff4141":"#408cff"}" stroke-width="2"/>`;
  }
 }

 for(let i=0;i<3;i++){
  const t=start+(end-start)*i/2;
  out+=`<text x="${x(t)}" y="${h-7}" text-anchor="middle" fill="#9fb0c8" font-size="10">${kst(t)}</text>`;
 }
 svg.innerHTML=out;
}

function render(){
 if(!rows.length||loadedCoin!==coin)return;
 const r=rows.at(-1),end=num(r.timestamp)+60000;
 const start=Math.max(num(rows[0].timestamp),end-hours*3600000);
 const data=rows.filter(r=>num(r.timestamp)>=start);
 const age=(Date.now()-end)/60000;
 $("status").textContent=coin+" · "+kst(end)+" KST 확정 기준"
  +" · "+r.quality+" · "+r["SIGNAL"+period]
  +(age>3?" · 게시 지연 "+Math.floor(age)+"분":"")
  +(period!==60?" · 연구용":"");
 const metrics=[
  ["가격",num(r.close).toLocaleString("ko-KR")+"원"],
  ["V"+period,fmt(num(r["V"+period]))],
  ["A"+period,fmt(num(r["A"+period]))],
  ["J"+period,fmt(num(r["J"+period]))]
 ];
 $("metrics").innerHTML=metrics.map(([k,v])=>
  `<div class="metric"><small>${k}</small><div class="value">${v}</div></div>`
 ).join("");
 chart("priceChart",data,"close","#59b7ff",start,end);
 chart("vChart",data,"V"+period,"#48d5a2",start,end);
 chart("aChart",data,"A"+period,"#ffbc69",start,end);
 chart("jChart",data,"J"+period,"#f38bb3",start,end);
}

for(const key of ["coin","period","hours"]){
 document.querySelectorAll("[data-"+key+"]").forEach(b=>{
  b.onclick=()=>{
   document.querySelectorAll("[data-"+key+"]")
    .forEach(x=>x.classList.toggle("active",x===b));
   if(key==="coin"){
    coin=b.dataset.coin;
    rows=[];fills=[];
    $("metrics").innerHTML="";
    document.querySelectorAll("svg").forEach(s=>s.innerHTML="");
    $("status").textContent="데이터 연결 중";
    load();
   }
   if(key==="period"){period=Number(b.dataset.period);render()}
   if(key==="hours"){hours=Number(b.dataset.hours);render()}
  };
 });
}
for(const id of ["buy","sell","signals"])$(id).onchange=render;
$("refresh").onclick=load;
window.addEventListener("resize",render);
setInterval(()=>{if(!document.hidden)load()},60000);
load();
</script>
</body>
</html>
